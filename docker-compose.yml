services:
  postgres:
    image: postgres:16-alpine
    container_name: freelancer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: freelancer
      POSTGRES_PASSWORD: freelancer
      POSTGRES_DB: freelancer
    # Host port 5433 avoids clashing with an existing local Postgres on 5432.
    ports:
      - "5433:5432"
    # Bind-mount the data directory onto the D: drive so the Postgres volume
    # never consumes space on C:. The folder is gitignored.
    volumes:
      - ./docker/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freelancer -d freelancer"]
      interval: 5s
      timeout: 5s
      retries: 10
